<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 4 Levels of Value</title>
<meta name="description" content="Map your expertise to all 4 levels of value and discover what's possible. A Market Disruptors tool.">
<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html, body { margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-soft: #f5f5f7;
    --surface: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #86868b;
    --separator: rgba(0,0,0,0.1);
    --separator-soft: rgba(0,0,0,0.06);
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --accent-pressed: #006edb;
    --accent-soft: rgba(0,113,227,0.08);
    --success: #28a745;
    --error: #ff3b30;
    --error-bg: rgba(255,59,48,0.06);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.47059;
    letter-spacing: -0.022em;
  }

  /* Sections are full-bleed, alternate white/gray. Content centered inside. */
  section {
    padding: 6rem 1.5rem;
  }
  section.tight { padding: 3rem 1.5rem; }
  section.soft { background: var(--bg-soft); }

  .container { max-width: 720px; margin: 0 auto; }
  .container-narrow { max-width: 560px; margin: 0 auto; }

  /* ====== HERO ====== */
  .hero {
    text-align: center;
    padding: 7rem 1.5rem 5rem;
  }
  .eyebrow {
    font-size: 17px;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: -0.022em;
  }
  .headline {
    font-size: 64px;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.025em;
    color: var(--text);
    margin: 0 0 20px;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }
  .subhead {
    font-size: 24px;
    font-weight: 400;
    line-height: 1.33;
    color: var(--text-secondary);
    max-width: 600px;
    margin: 0 auto;
    letter-spacing: 0.009em;
  }

  /* ====== SECTION HEADERS ====== */
  .section-eyebrow {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 40px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.015em;
    color: var(--text);
    margin: 0 0 16px;
  }
  .section-lead {
    font-size: 19px;
    line-height: 1.4211;
    color: var(--text-secondary);
    margin: 0 0 3rem;
    letter-spacing: 0.012em;
    max-width: 540px;
  }

  /* ====== TIMELINE ====== */
  .timeline { position: relative; padding: 1rem 0; }
  .timeline-rail {
    position: absolute;
    left: 11px; top: 28px; bottom: 28px;
    width: 2px;
    background: var(--separator-soft);
  }
  .timeline-rail-blue {
    position: absolute;
    left: 11px;
    width: 2px;
    background: var(--accent);
  }
  .timeline-item {
    position: relative;
    padding: 28px 0 28px 48px;
    display: flex;
    align-items: flex-start;
  }
  .timeline-dot {
    position: absolute;
    left: 0;
    top: 32px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--separator);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    z-index: 1;
  }
  .timeline-item.above .timeline-dot {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .timeline-content { flex: 1; min-width: 0; }
  .timeline-name {
    font-size: 28px;
    font-weight: 600;
    line-height: 1.14;
    letter-spacing: -0.015em;
    margin: 0 0 4px;
    color: var(--text);
  }
  .timeline-item.above .timeline-name { color: var(--text); }
  .timeline-resource {
    font-size: 17px;
    line-height: 1.47;
    color: var(--text-secondary);
    margin: 0 0 8px;
    letter-spacing: -0.022em;
  }
  .timeline-income {
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: -0.016em;
  }
  .timeline-item:not(.above) .timeline-income { color: var(--text-tertiary); }

  .dotted-line {
    position: relative;
    padding: 8px 0 8px 48px;
    margin: 0;
  }
  .dotted-line-rule {
    border-top: 1.5px dashed var(--accent);
    opacity: 0.45;
    margin: 0;
  }
  .dotted-line-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 12px;
  }

  /* ====== SAMPLE LADDER LINK ====== */
  .sample-trigger {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 17px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
    margin-top: 2.5rem;
    letter-spacing: -0.022em;
    transition: opacity 0.15s ease;
  }
  .sample-trigger:hover { opacity: 0.75; }
  .sample-trigger-arrow {
    font-size: 14px;
    transition: transform 0.2s ease;
  }
  .sample-trigger.open .sample-trigger-arrow { transform: rotate(180deg); }

  .sample-body {
    display: none;
    margin-top: 2rem;
    padding: 2rem 0 0;
    border-top: 1px solid var(--separator-soft);
    animation: fadeIn 0.3s ease;
  }
  .sample-body.open { display: block; }
  .sample-meta {
    font-size: 14px;
    color: var(--text-tertiary);
    margin-bottom: 2rem;
    letter-spacing: -0.008em;
  }
  .sample-meta strong { color: var(--text); font-weight: 600; }
  .sample-row { padding: 1.25rem 0; border-bottom: 1px solid var(--separator-soft); }
  .sample-row:last-child { border-bottom: none; }
  .sample-row-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .sample-level { font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: -0.005em; }
  .sample-income { font-size: 13px; color: var(--text-tertiary); font-weight: 500; }
  .sample-body-text { font-size: 17px; color: var(--text); line-height: 1.47; letter-spacing: -0.022em; }

  /* ====== FORM ====== */
  .form-section { padding: 6rem 1.5rem; }
  .form-section .section-title { text-align: center; }
  .form-section .section-lead { text-align: center; margin-left: auto; margin-right: auto; margin-bottom: 3rem; }

  .field { margin-bottom: 2rem; }
  .label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 10px;
    letter-spacing: -0.016em;
  }
  .input {
    width: 100%;
    padding: 16px 18px;
    font-size: 17px;
    font-family: inherit;
    background: var(--bg-soft);
    border: 1px solid transparent;
    border-radius: 14px;
    color: var(--text);
    transition: all 0.2s ease;
    line-height: 1.4;
    letter-spacing: -0.022em;
  }
  .input::placeholder { color: var(--text-tertiary); }
  .input:focus {
    outline: none;
    background: var(--bg);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .textarea { min-height: 110px; resize: vertical; }

  .level-picker {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .pick {
    padding: 18px 8px;
    background: var(--bg-soft);
    border: 1px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    transition: all 0.15s ease;
    color: var(--text);
  }
  .pick:hover { background: #ececef; }
  .pick.selected {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(0,113,227,0.25);
  }
  .pick-num { font-size: 20px; font-weight: 600; line-height: 1; letter-spacing: -0.025em; }
  .pick-lbl { font-size: 11px; font-weight: 500; margin-top: 6px; color: var(--text-secondary); letter-spacing: -0.005em; }
  .pick.selected .pick-lbl { color: rgba(255,255,255,0.85); }

  .submit {
    width: 100%;
    padding: 18px 24px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 980px;
    font-size: 17px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    margin-top: 2rem;
    transition: all 0.2s ease;
    letter-spacing: -0.022em;
  }
  .submit:hover:not(:disabled) { background: var(--accent-hover); }
  .submit:active:not(:disabled) { background: var(--accent-pressed); transform: scale(0.99); }
  .submit:disabled { background: #d2d2d7; cursor: not-allowed; }

  /* ====== LOADING ====== */
  .loading {
    text-align: center;
    padding: 6rem 1.5rem;
  }
  .spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 2.5px solid var(--separator);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 22px; font-weight: 600; color: var(--text); letter-spacing: -0.015em; }
  .loading-sub { font-size: 15px; color: var(--text-secondary); margin-top: 10px; letter-spacing: -0.016em; }

  /* ====== RESULTS ====== */
  .results { animation: fadeIn 0.5s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .results-hero {
    text-align: center;
    padding: 6rem 1.5rem 3rem;
  }
  .results-hero .eyebrow { color: var(--text-tertiary); font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; }
  .results-expertise {
    font-size: 40px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.015em;
    color: var(--text);
    max-width: 600px;
    margin: 0 auto;
  }

  .ladder-tabs-wrap {
    position: sticky;
    top: 0;
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--separator-soft);
    z-index: 10;
  }
  .ladder-tabs {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 0 1rem;
  }
  .tab {
    padding: 18px 8px 16px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: inherit;
    color: var(--text-secondary);
    transition: color 0.15s ease;
    text-align: center;
    position: relative;
    border-bottom: 2px solid transparent;
    letter-spacing: -0.022em;
  }
  .tab:hover:not(.active) { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab.current-level::after {
    content: 'You';
    position: absolute;
    top: 4px;
    right: calc(50% - 26px);
    font-size: 9px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.02em;
  }
  .tab-num { font-size: 22px; font-weight: 600; line-height: 1; }
  .tab-lbl { font-size: 11px; font-weight: 500; margin-top: 6px; }

  .panel { padding: 4rem 1.5rem 5rem; }

  .panel-eyebrow {
    font-size: 14px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .panel-headline {
    font-size: 36px;
    font-weight: 600;
    line-height: 1.13;
    letter-spacing: -0.015em;
    color: var(--text);
    margin: 0 0 1.5rem;
  }
  .panel-income {
    font-size: 18px;
    color: var(--text-secondary);
    margin: 0 0 3rem;
    letter-spacing: -0.022em;
  }
  .panel-income strong { color: var(--accent); font-weight: 600; }

  .quote {
    font-size: 28px;
    font-weight: 500;
    line-height: 1.28;
    letter-spacing: -0.015em;
    color: var(--text);
    margin: 0 0 3.5rem;
    padding: 0;
    max-width: 580px;
  }
  .quote::before {
    content: '“';
    display: block;
    font-size: 60px;
    line-height: 0.5;
    color: var(--accent);
    margin-bottom: 12px;
    font-family: Georgia, serif;
  }

  .panel-section { margin-bottom: 3rem; }
  .panel-section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 18px;
  }
  .panel-section-body {
    font-size: 19px;
    line-height: 1.52;
    color: var(--text);
    letter-spacing: -0.018em;
  }

  .bullets { list-style: none; padding: 0; margin: 0; }
  .bullet {
    padding: 20px 0;
    border-bottom: 1px solid var(--separator-soft);
    display: flex;
    gap: 20px;
    align-items: flex-start;
    font-size: 19px;
    line-height: 1.47;
    letter-spacing: -0.018em;
  }
  .bullet:last-child { border-bottom: none; padding-bottom: 0; }
  .bullet:first-child { padding-top: 0; }
  .bullet-num {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    min-width: 24px;
    line-height: 1.5;
  }

  .actions {
    margin-top: 4rem;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .action {
    padding: 14px 28px;
    border-radius: 980px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
    letter-spacing: -0.022em;
    min-width: 180px;
  }
  .action-primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  .action-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .action-secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .action-secondary:hover { background: var(--accent-soft); }
  .action:active { transform: scale(0.98); }

  .restart {
    display: block;
    margin: 3rem auto 0;
    background: none;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    letter-spacing: -0.022em;
  }
  .restart:hover { color: var(--accent); }

  .error {
    background: var(--error-bg);
    color: var(--error);
    padding: 16px 18px;
    border-radius: 14px;
    font-size: 14px;
    margin-top: 1.5rem;
    line-height: 1.5;
    letter-spacing: -0.016em;
    border: 1px solid rgba(255,59,48,0.15);
  }
  .error-retry {
    background: var(--error);
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 980px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 12px;
    font-family: inherit;
    font-weight: 500;
    letter-spacing: -0.022em;
  }

  /* ====== FOOTER ====== */
  footer {
    text-align: center;
    padding: 3rem 1.5rem;
    color: var(--text-tertiary);
    font-size: 12px;
    letter-spacing: -0.005em;
    border-top: 1px solid var(--separator-soft);
  }
  footer a { color: var(--text-secondary); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  /* ====== API KEY SETUP ====== */
  .setup {
    background: var(--bg-soft);
    border-radius: 14px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 2rem;
    font-size: 14px;
    line-height: 1.55;
    letter-spacing: -0.016em;
  }
  .setup-title { font-weight: 600; margin-bottom: 4px; color: var(--text); }
  .setup-body { color: var(--text-secondary); }
  .setup a { color: var(--accent); text-decoration: none; }
  .setup a:hover { text-decoration: underline; }
  .key-input-row { display: flex; gap: 8px; margin-top: 12px; }
  .key-input-row .input { flex: 1; padding: 10px 14px; font-size: 13px; font-family: ui-monospace, monospace; background: var(--surface); }
  .key-save {
    padding: 10px 20px; background: var(--accent); color: #fff;
    border: none; border-radius: 980px; font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: inherit; letter-spacing: -0.022em;
  }
  .key-save:hover { background: var(--accent-hover); }
  .key-status {
    margin-top: 10px; font-size: 13px; color: var(--success);
    display: flex; align-items: center; gap: 8px; letter-spacing: -0.008em;
  }
  .key-status::before { content: '●'; }
  .key-clear {
    background: none; border: none; color: var(--text-tertiary);
    text-decoration: underline; cursor: pointer; font-size: 12px;
    font-family: inherit; margin-left: auto;
  }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 720px) {
    section { padding: 4rem 1.25rem; }
    .hero { padding: 4rem 1.25rem 3rem; }
    .form-section { padding: 4rem 1.25rem; }
    .results-hero { padding: 4rem 1.25rem 2rem; }
    .panel { padding: 3rem 1.25rem 4rem; }
    .headline { font-size: 44px; letter-spacing: -0.022em; }
    .subhead { font-size: 19px; }
    .section-title { font-size: 30px; }
    .results-expertise { font-size: 28px; }
    .panel-headline { font-size: 26px; }
    .quote { font-size: 22px; }
    .panel-section-body, .bullet { font-size: 17px; }
    .timeline-name { font-size: 22px; }
    .timeline-resource { font-size: 15px; }
    .pick { padding: 14px 4px; }
    .pick-num { font-size: 18px; }
  }

  /* ====== DARK MODE ====== */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --bg-soft: #1c1c1e;
      --surface: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-tertiary: #6e6e73;
      --separator: rgba(255,255,255,0.15);
      --separator-soft: rgba(255,255,255,0.08);
      --accent: #2997ff;
      --accent-hover: #4ba8ff;
      --accent-pressed: #1a8aff;
      --accent-soft: rgba(41,151,255,0.15);
      --error-bg: rgba(255,59,48,0.1);
    }
    .pick:hover { background: #2c2c2e; }
    .submit:disabled { background: #3a3a3c; color: #6e6e73; }
    .ladder-tabs-wrap { background: rgba(0,0,0,0.7); }
  }
</style>
</head>
<body>

<div id="app"></div>

<footer>
  A <a href="#">Market Disruptors</a> tool · Built on the 4 Levels of Value framework
</footer>

<script>
const MODE = 'proxy';
const PROXY_URL = 'https://four-levels-proxy.alin-581.workers.dev';

const app = document.getElementById('app');

const levels = [
  { num: 1, name: 'Implementation', label: 'Muscle' },
  { num: 2, name: 'Unification', label: 'Manage' },
  { num: 3, name: 'Communication', label: 'Message' },
  { num: 4, name: 'Imagination', label: 'Invent' }
];

let state = {
  phase: 'input',
  expertise: '',
  currentLevel: 1,
  activeTab: 1,
  ladder: null,
  error: null,
  retryCount: 0,
  apiKey: localStorage.getItem('anthropic_api_key') || ''
};

function render() {
  if (state.phase === 'input') renderInput();
  else if (state.phase === 'loading') renderLoading();
  else if (state.phase === 'results') renderResults();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function renderInput() {
  const showKeySetup = MODE === 'byok';
  const hasKey = state.apiKey && state.apiKey.startsWith('sk-ant-');

  app.innerHTML = `
    <section class="hero">
      <div class="eyebrow">Market Disruptors</div>
      <h1 class="headline">The 4 Levels of Value.</h1>
      <p class="subhead">Most people trade muscle for money their whole lives. The wealthy trade something else.</p>
    </section>

    <section class="soft">
      <div class="container">
        <div class="section-eyebrow">The Framework</div>
        <h2 class="section-title">Where wealth lives.</h2>
        <p class="section-lead">Four levels of value exist in the earth. The lower two pay you for your body. The upper two pay you for your mind. Wealth is created above the dotted line.</p>

        <div class="timeline">
          <div class="timeline-item above">
            <div class="timeline-dot">4</div>
            <div class="timeline-content">
              <h3 class="timeline-name">Imagination</h3>
              <p class="timeline-resource">Your mind. Solving problems more elegantly than anyone has before.</p>
              <div class="timeline-income">$1M – $1B+</div>
            </div>
          </div>

          <div class="timeline-item above">
            <div class="timeline-dot">3</div>
            <div class="timeline-content">
              <h3 class="timeline-name">Communication</h3>
              <p class="timeline-resource">Your mouth. Conversations that create cash flow. Messages that move masses.</p>
              <div class="timeline-income">$100k – $100M</div>
            </div>
          </div>

    </div>
  `;
}

async function callAPI(prompt, attempt = 1) {
  const maxAttempts = 2;
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 90000);

    const headers = { "Content-Type": "application/json" };
    let endpoint;
    let body;

    if (MODE === 'byok') {
      endpoint = "https://api.anthropic.com/v1/messages";
      headers["x-api-key"] = state.apiKey;
      headers["anthropic-version"] = "2023-06-01";
      headers["anthropic-dangerous-direct-browser-access"] = "true";
      body = {
        model: "claude-sonnet-4-5",
        max_tokens: 2000,
        messages: [{ role: "user", content: prompt }]
      };
    } else {
      endpoint = PROXY_URL;
      body = { prompt };
    }

    const response = await fetch(endpoint, {
      method: "POST",
      headers,
      body: JSON.stringify(body),
      signal: controller.signal
    });

    clearTimeout(timeout);

    if (!response.ok) {
      const text = await response.text();
      throw new Error(`API ${response.status}: ${text.slice(0, 200)}`);
    }

    return await response.json();
  } catch (err) {
    if (attempt < maxAttempts && err.name !== 'AbortError') {
      state.retryCount = attempt;
      render();
      await new Promise(r => setTimeout(r, 1500));
      return callAPI(prompt, attempt + 1);
    }
    throw err;
  }
}

async function generateLadder() {
  state.phase = 'loading';
  state.error = null;
  state.retryCount = 0;
  render();

  const prompt = `You are channeling Myron Golden's teaching on the 4 Levels of Value. Speak with his voice, his cadence, his worldview.

THE FRAMEWORK (in Myron's own teaching):

Wealth is a spiritual outcome. Poverty is the result of spiritual warfare — the enemy comes to steal, kill, and destroy. The 4 Levels of Value are God's design from Genesis 1, where He imagined, communicated ("let us make man"), unified (Father, Son, Holy Spirit working as one), and implemented (formed man from the dust). The lower levels are below the dotted line. Wealth lives above it. Most people stay below it because they were never taught the truth.

LEVEL 1 — IMPLEMENTATION (below the dotted line)
- The resource: muscles × time. Manipulating material matter with your body.
- Income: minimum wage to $80,000/year. Hard ceiling.
- Example: mechanic working on a Rolls-Royce making $80k.
- Why people get stuck: They were programmed to believe "a hard day's work for a hard day's pay." They think harder = more pay. They think hard = valuable. It's not.
- The killer phrase: "Thinking is the hardest work most people never do."

LEVEL 2 — UNIFICATION (below the dotted line)
- The resource: management skills × the people you manage.
- Income: $40k (managing Taco Bell) to $250k (middle management at Lockheed).
- Why people get stuck: $21k/month gross feels comfortable. They mistake comfort for completion. There is a ceiling here too — it's just higher.

LEVEL 3 — COMMUNICATION (above the dotted line — WEALTH LIVES HERE)
- The resource: your mouth. "Conversations that create cash flow. Messages that move the masses."
- Income: $100k (car salesperson) to $100M (A-list actor, singer, author).
- Why people get stuck: "Children should be seen and not heard." Sit still and be quiet. Nobody ever told them: if you get really good at talking, you get really good at communicating, you become influential, powerful, and wealthy. This is the fastest path out of poverty.
- Examples of Level 3: salesperson, songwriter, podcaster, YouTuber, newsletter writer, author, speaker, actor.

LEVEL 4 — IMAGINATION (the highest level)
- The resource: your mind OR your money.
- Income: $1M to trillions. There are trillionaires now.
- The key: people pay you not because you worked harder, but because you thought about their problem more elegantly than they did. "When you can demonstrate that you've thought about your ideal client's problem more than they have, they will happily pay you."
- Why it's hard to reach: new and disruptive ideas are untested, often resisted, and risky. But the earning potential is unlimited.

THE THREE FULFILLMENTS (Myron's core insight, do not skip this):
Humans were made in God's image, so we feel fulfilled by what God does: CREATE, CONNECT, CONTRIBUTE. God created creation (creating). God made man so He'd have someone like Him to connect with (connecting). God sacrificed His son to do for us what we couldn't do for ourselves (contributing). When you climb the levels of value, you do all three — at scale.

MYRON'S SIGNATURE PHRASES (use his voice — fold these in where they fit, don't quote verbatim more than once):
- "Make your brain sweat more so your body can sweat less."
- "I don't get paid more because I work harder. I get paid because I know what to do and how to say what to do."
- "Conversations that create cash flow. Messages that move the masses."
- "Wealth is a spiritual outcome."
- "Below the dotted line you trade muscle for money. Above it, you trade ideas for income."
- "When you've thought about your client's problem more than they have, they will happily pay you."
- "Thinking is the hardest work most people never do."

==========================
THE USER
==========================
Their expertise: "${state.expertise}"
They currently operate at Level ${state.currentLevel}.

==========================
YOUR TASK
==========================
For their SPECIFIC expertise, map all 4 levels. Be concrete and specific to their domain — not generic. Speak with Myron's voice: direct, biblical, provocative, no fluff. Use his framing of muscle/management/mouth/mind.

For each level, return:
- example: 1 concrete sentence describing what THIS person doing THIS expertise looks like AT this level. Be specific (e.g. "Run a 5-truck plumbing crew serving residential customers in your metro," not "Manage a team").
- income: A realistic income range for this level applied to THEIR expertise. Match Myron's ranges.
- moves: Exactly 3 short actionable moves (8-14 words each) to operate at this level or climb to it. Use action verbs. Make them specific to their expertise.
- trap: 1 sentence — the specific lie or limiting belief that keeps people stuck at this level in their domain. Channel Myron's directness ("you were programmed to believe...").
- quote: 1 sharp quotable line (under 20 words) in Myron's voice — the mindset shift required. Make it provocative and rhythmic.
- fulfillment: 1 sentence on how operating at this level expresses creating, connecting, and/or contributing for someone with this expertise.

Return ONLY valid JSON, no preamble, no markdown, no code fences:
{
  "1": { "example": "...", "income": "...", "moves": ["...", "...", "..."], "trap": "...", "quote": "...", "fulfillment": "..." },
  "2": { "example": "...", "income": "...", "moves": ["...", "...", "..."], "trap": "...", "quote": "...", "fulfillment": "..." },
  "3": { "example": "...", "income": "...", "moves": ["...", "...", "..."], "trap": "...", "quote": "...", "fulfillment": "..." },
  "4": { "example": "...", "income": "...", "moves": ["...", "...", "..."], "trap": "...", "quote": "...", "fulfillment": "..." }
}`;

  try {
    const data = await callAPI(prompt);

    let text = '';
    if (Array.isArray(data.content)) {
      text = data.content.filter(b => b.type === 'text').map(b => b.text).join('\n');
    } else if (data.text) {
      text = data.text;
    }

    text = text.replace(/```json/g, '').replace(/```/g, '').trim();
    const firstBrace = text.indexOf('{');
    const lastBrace = text.lastIndexOf('}');
    if (firstBrace === -1 || lastBrace === -1) throw new Error('Response did not contain valid data');
    text = text.slice(firstBrace, lastBrace + 1);

    const ladder = JSON.parse(text);

    for (let i = 1; i <= 4; i++) {
      if (!ladder[i] || !ladder[i].example || !ladder[i].moves) {
        throw new Error('Response missing required fields');
      }
    }

    state.ladder = ladder;
    state.activeTab = state.currentLevel;
    state.phase = 'results';
    state.retryCount = 0;
    render();
  } catch (err) {
    state.phase = 'input';
    let msg = err.message || 'Connection failed';
    if (err.name === 'AbortError') msg = 'Request timed out';
    if (msg.includes('Failed to fetch')) msg = 'Network connection failed';
    if (msg.includes('401')) msg = 'Your API key was rejected. Check that it\'s valid.';
    if (msg.includes('429')) msg = 'Rate limited. Wait a moment and try again.';
    state.error = msg;
    render();
  }
}

      const btn = document.querySelector('[data-act="share"]');
      const orig = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = orig; }, 2000);
    });

  document.querySelector('[data-act="print"]').addEventListener('click', () => {
    window.print();
  });

  document.querySelector('.restart').addEventListener('click', () => {
    state = {
      phase: 'input', expertise: '', currentLevel: 1, activeTab: 1,
      ladder: null, error: null, retryCount: 0,

function buildShareText() {
  const lines = [
    `MY 4 LEVELS OF VALUE LADDER`,
    `Expertise: ${state.expertise}`,
    ``
  ];
  for (let i = 4; i >= 1; i--) {
    const d = state.ladder[i];
    const meta = levels[i - 1];
    lines.push(`━━━ LEVEL ${i}: ${meta.name.toUpperCase()} ${i === state.currentLevel ? '← YOU' : ''} ━━━`);
    lines.push(`What it looks like: ${d.example}`);
    lines.push(`Income: ${d.income}`);
    lines.push(`Quote: "${d.quote}"`);
    lines.push(`Moves:`);
    d.moves.forEach((m, idx) => lines.push(`  ${idx + 1}. ${m}`));
    lines.push(`Trap: ${d.trap}`);
    if (d.fulfillment) lines.push(`Create · Connect · Contribute: ${d.fulfillment}`);
    lines.push(``);
  }
  return lines.join('\n');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
